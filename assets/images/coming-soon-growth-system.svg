  <circle cx="766" cy="760" r="190" fill="#62f7d4" opacity="0.06"/>
  <rect x="132" y="142" width="696" height="676" rx="48" fill="url(#panel)" stroke="#62f7d4" stroke-opacity="0.2" filter="url(#softShadow)"/>
  <rect x="184" y="198" width="592" height="62" rx="31" fill="#62f7d4" opacity="0.12"/>
  <rect x="184" y="292" width="592" height="10" rx="5" fill="#ffffff" opacity="0.12"/>
  <rect x="184" y="328" width="420" height="10" rx="5" fill="#ffffff" opacity="0.09"/>
  <g fill="none" stroke="#62f7d4" stroke-width="4" stroke-linecap="round" opacity="0.48">
    <path d="M260 580h92c34 0 62-28 62-62v-26"/>
    <path d="M700 580h-92c-34 0-62-28-62-62v-26"/>
    <path d="M480 492v118"/>
