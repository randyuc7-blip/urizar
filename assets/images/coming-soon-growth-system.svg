<svg xmlns="http://www.w3.org/2000/svg" width="960" height="960" viewBox="0 0 960 960" role="img" aria-labelledby="title desc">
  <title id="title">Coming soon growth system visual</title>
  <desc id="desc">A snappy coming soon placeholder for the next growth system preview.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="860" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#102b34"/>
