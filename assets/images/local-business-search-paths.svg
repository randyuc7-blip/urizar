<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">How local businesses move from a search to the right next step</title>
  <desc id="desc">A connected path from a customer search through service, industry, Texas location, or resource pages to a clear answer and an easier next step.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17272f"/>
      <stop offset="1" stop-color="#101c23"/>
    </linearGradient>
    <linearGradient id="accentPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f554f"/>
      <stop offset="1" stop-color="#173c3e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#02090d" flood-opacity=".34"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#62f7d4"/>
    </marker>
    <style>
      .label{font:700 15px Arial,sans-serif;letter-spacing:2.4px;fill:#62f7d4}
      .heading{font:700 27px Arial,sans-serif;fill:#f5f8fa}
      .cardHeading{font:700 21px Arial,sans-serif;fill:#f5f8fa}
      .body{font:500 17px Arial,sans-serif;fill:#a9bac5}
      .chip{font:700 16px Arial,sans-serif;fill:#eaf1f4}
      .step{font:700 14px Arial,sans-serif;letter-spacing:1.8px;fill:#8fa4b0}
    </style>
  </defs>

  <rect width="1200" height="620" rx="34" fill="#0d181e"/>
  <path d="M55 87H1145" stroke="#263840" stroke-width="1"/>
  <text x="55" y="57" class="label">ONE CONNECTED PATH FROM SEARCH TO ACTION</text>

  <g filter="url(#shadow)">
    <rect x="55" y="137" width="255" height="345" rx="26" fill="url(#panel)" stroke="#30434c"/>
    <circle cx="92" cy="179" r="18" fill="#62f7d4" fill-opacity=".13" stroke="#62f7d4" stroke-opacity=".65"/>
    <path d="m85 179 5 5 10-11" fill="none" stroke="#62f7d4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="122" y="185" class="step">01 · SEARCH NEED</text>
    <text x="85" y="245" class="heading">Your customer</text>
    <text x="85" y="279" class="heading">needs an answer.</text>
    <text x="85" y="328" class="body">They may search by service,</text>
    <text x="85" y="354" class="body">industry, location, or problem.</text>
    <rect x="85" y="393" width="195" height="48" rx="24" fill="#0f2028" stroke="#344a54"/>
    <text x="183" y="423" text-anchor="middle" class="chip">“Can you help me?”</text>
  </g>

  <path d="M325 309H372" fill="none" stroke="#62f7d4" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="390" y="112" width="420" height="395" rx="28" fill="url(#accentPanel)" stroke="#62f7d4" stroke-opacity=".48" stroke-width="2"/>
    <text x="430" y="158" class="step">02 · THE RIGHT PAGE MEETS THE INTENT</text>

    <g>
      <rect x="430" y="188" width="160" height="112" rx="19" fill="#12272d" stroke="#3d6665"/>
      <circle cx="457" cy="216" r="6" fill="#62f7d4"/>
      <text x="476" y="222" class="cardHeading">Services</text>
      <text x="457" y="259" class="body" font-size="15">Websites, leads</text>
      <text x="457" y="282" class="body" font-size="15">and follow-up</text>
    </g>
    <g>
      <rect x="610" y="188" width="160" height="112" rx="19" fill="#12272d" stroke="#3d6665"/>
      <circle cx="637" cy="216" r="6" fill="#62f7d4"/>
      <text x="656" y="222" class="cardHeading">Industries</text>
      <text x="637" y="259" class="body" font-size="15">A system shaped</text>
      <text x="637" y="282" class="body" font-size="15">around the work</text>
    </g>
    <g>
      <rect x="430" y="320" width="160" height="112" rx="19" fill="#12272d" stroke="#3d6665"/>
      <circle cx="457" cy="348" r="6" fill="#62f7d4"/>
      <text x="476" y="354" class="cardHeading">Texas</text>
      <text x="457" y="391" class="body" font-size="15">Local guidance for</text>
      <text x="457" y="414" class="body" font-size="15">Dallas-area teams</text>
    </g>
    <g>
      <rect x="610" y="320" width="160" height="112" rx="19" fill="#12272d" stroke="#3d6665"/>
      <circle cx="637" cy="348" r="6" fill="#62f7d4"/>
      <text x="656" y="354" class="cardHeading">Resources</text>
      <text x="637" y="391" class="body" font-size="15">Answers, guides</text>
      <text x="637" y="414" class="body" font-size="15">and practical tools</text>
    </g>

    <rect x="430" y="453" width="340" height="32" rx="16" fill="#62f7d4" fill-opacity=".09"/>
    <text x="600" y="475" text-anchor="middle" class="chip" font-size="14">Clear language connects every path</text>
  </g>

  <path d="M825 309H872" fill="none" stroke="#62f7d4" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="890" y="137" width="255" height="345" rx="26" fill="url(#panel)" stroke="#30434c"/>
    <circle cx="927" cy="179" r="18" fill="#62f7d4" fill-opacity=".13" stroke="#62f7d4" stroke-opacity=".65"/>
    <path d="M918 179h18M930 173l6 6-6 6" fill="none" stroke="#62f7d4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="957" y="185" class="step">03 · NEXT STEP</text>
    <text x="920" y="245" class="heading">They understand</text>
    <text x="920" y="279" class="heading">what fits.</text>
    <text x="920" y="328" class="body">Useful answers build trust</text>
    <text x="920" y="354" class="body">before you get in touch.</text>
    <rect x="920" y="393" width="195" height="48" rx="24" fill="#62f7d4"/>
    <text x="1017.5" y="423" text-anchor="middle" style="font:700 15px Arial,sans-serif;fill:#09201f">Explore or get in touch</text>
  </g>

  <text x="600" y="572" text-anchor="middle" class="body">Easy to find. Easy to understand. Easy to act on.</text>
</svg>
