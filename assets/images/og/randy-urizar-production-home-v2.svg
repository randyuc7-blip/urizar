<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Randy Urizar Production — tailor-made growth systems</title>
  <desc id="description">A dark, structured social preview showing a guided local business system from discovery through client care.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050C10"/>
      <stop offset="0.55" stop-color="#071116"/>
      <stop offset="1" stop-color="#0D1A21"/>
    </linearGradient>
    <radialGradient id="mintGlow" cx="0" cy="0" r="1" gradientTransform="translate(170 176) rotate(41) scale(410 330)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#62F7D4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#62F7D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="indigoGlow" cx="0" cy="0" r="1" gradientTransform="translate(1055 228) rotate(120) scale(400 340)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5876FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#5876FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pathLine" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#62F7D4"/>
      <stop offset="1" stop-color="#5876FF"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="nodeGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#62F7D4" flood-opacity="0.10"/>
    </filter>
    <clipPath id="logoClip">
      <rect x="78" y="58" width="42" height="42" rx="12"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#mintGlow)"/>
  <rect width="1200" height="630" fill="url(#indigoGlow)"/>

  <g opacity="0.22" stroke="#A7B6C2" stroke-width="1">
    <path d="M0 126H1200"/>
    <path d="M0 504H1200"/>
    <path d="M650 0V630"/>
    <path d="M1110 0V630"/>
  </g>

  <rect x="34" y="34" width="1132" height="562" rx="34" fill="none" stroke="#FFFFFF" stroke-opacity="0.09"/>

  <g aria-label="Brand">
    <rect x="78" y="58" width="42" height="42" rx="12" fill="#0D1A21" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <image x="78" y="58" width="42" height="42" href="../../icons/randy-urizar-logo.png" xlink:href="../../icons/randy-urizar-logo.png" preserveAspectRatio="xMidYMid slice" clip-path="url(#logoClip)"/>
    <text x="136" y="86" fill="#F4F7FA" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="0.2">RANDY URIZAR PRODUCTION</text>
    <text x="1122" y="84" fill="#A7B6C2" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="2.2" text-anchor="end">GROWTH SYSTEMS · TEXAS</text>
  </g>

  <g aria-label="Primary message">
    <text x="78" y="207" fill="#62F7D4" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="2.4">GUIDED, NOT GENERIC</text>
    <text x="78" y="269" fill="#F4F7FA" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-1.5">
      <tspan x="78" dy="0">Tailor-made growth</tspan>
      <tspan x="78" dy="66">systems for local</tspan>
      <tspan x="78" dy="66">businesses.</tspan>
    </text>
    <text x="78" y="468" fill="#A7B6C2" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500">
      <tspan x="78" dy="0">Clearer lead handling. Better follow-up.</tspan>
      <tspan x="78" dy="29">Guided implementation.</tspan>
    </text>
  </g>

  <g aria-label="Capabilities" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">
    <g transform="translate(78 535)">
      <rect width="126" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.055" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <circle cx="20" cy="19" r="4" fill="#62F7D4"/>
      <text x="34" y="24" fill="#F4F7FA">Website clarity</text>
    </g>
    <g transform="translate(216 535)">
      <rect width="103" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.055" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <circle cx="20" cy="19" r="4" fill="#62F7D4"/>
      <text x="34" y="24" fill="#F4F7FA">Lead flow</text>
    </g>
    <g transform="translate(331 535)">
      <rect width="114" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.055" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <circle cx="20" cy="19" r="4" fill="#5876FF"/>
      <text x="34" y="24" fill="#F4F7FA">Automation</text>
    </g>
  </g>

  <g aria-label="Guided system diagram" filter="url(#softShadow)">
    <rect x="696" y="156" width="426" height="384" rx="32" fill="#071116" fill-opacity="0.78" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <text x="732" y="198" fill="#A7B6C2" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.2">YOUR GUIDED SYSTEM</text>

    <path d="M755 258V448" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="12" stroke-linecap="round"/>
    <path d="M755 258V448" stroke="url(#pathLine)" stroke-width="2" stroke-linecap="round"/>

    <g filter="url(#nodeGlow)">
      <circle cx="755" cy="258" r="8" fill="#62F7D4"/>
      <circle cx="755" cy="321" r="8" fill="#4EDDC9"/>
      <circle cx="755" cy="384" r="8" fill="#4EACDF"/>
      <circle cx="755" cy="448" r="8" fill="#5876FF"/>
    </g>

    <g font-family="Inter, Arial, sans-serif">
      <g transform="translate(786 232)">
        <rect width="294" height="52" rx="15" fill="#FFFFFF" fill-opacity="0.04" stroke="#62F7D4" stroke-opacity="0.18"/>
        <text x="20" y="22" fill="#F4F7FA" font-size="16" font-weight="700">01 · Discovery</text>
        <text x="20" y="40" fill="#A7B6C2" font-size="12">Understand the business and its workflow</text>
      </g>
      <g transform="translate(786 295)">
        <rect width="294" height="52" rx="15" fill="#FFFFFF" fill-opacity="0.04" stroke="#62F7D4" stroke-opacity="0.15"/>
        <text x="20" y="22" fill="#F4F7FA" font-size="16" font-weight="700">02 · Lead capture</text>
        <text x="20" y="40" fill="#A7B6C2" font-size="12">Turn interest into a clear next step</text>
      </g>
      <g transform="translate(786 358)">
        <rect width="294" height="52" rx="15" fill="#FFFFFF" fill-opacity="0.04" stroke="#5876FF" stroke-opacity="0.15"/>
        <text x="20" y="22" fill="#F4F7FA" font-size="16" font-weight="700">03 · Follow-up</text>
        <text x="20" y="40" fill="#A7B6C2" font-size="12">Respond consistently without extra admin</text>
      </g>
      <g transform="translate(786 422)">
        <rect width="294" height="52" rx="15" fill="#FFFFFF" fill-opacity="0.04" stroke="#5876FF" stroke-opacity="0.20"/>
        <text x="20" y="22" fill="#F4F7FA" font-size="16" font-weight="700">04 · Client care</text>
        <text x="20" y="40" fill="#A7B6C2" font-size="12">Create a smoother customer experience</text>
      </g>
    </g>

    <g transform="translate(732 496)">
      <rect width="348" height="1" fill="#FFFFFF" fill-opacity="0.08"/>
      <text x="0" y="28" fill="#62F7D4" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">ONE CLEARER PATH</text>
      <text x="348" y="28" fill="#A7B6C2" font-family="Inter, Arial, sans-serif" font-size="12" text-anchor="end">Built around how you work</text>
    </g>
  </g>
</svg>
